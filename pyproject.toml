[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-industry-rotation-ml"
version = "0.1.0"
description = "Benchmark-disciplined machine-learning comparison for monthly Chinese A-share industry rotation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yandi Cheng"}]
dependencies = [
  "akshare>=1.18,<2",
  "lightgbm>=4.6,<5",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.12,<2",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
