split:
  train_end: "20221231"
  validation_end: "20231231"
  test_end: "20260531"
portfolio:
  top_n: 3
  cost_rate: 0.001
bootstrap:
  block_months: 6
  simulations: 2000
  seed: 42
walk_forward_start: "20210101"
walk_forward_end: "20260531"
min_core_train_months: 60
validation_months: 12
random_state: 42
n_jobs: 1
random_top3_simulations: 1000
models:
  xgboost:
    - id: xgboost_1
      params: {n_estimators: 120, max_depth: 2, learning_rate: 0.03, subsample: 0.85, colsample_bytree: 0.85, reg_lambda: 5.0}
    - id: xgboost_2
      params: {n_estimators: 180, max_depth: 3, learning_rate: 0.03, subsample: 0.85, colsample_bytree: 0.85, reg_lambda: 10.0}
  lightgbm:
    - id: lightgbm_1
      params: {n_estimators: 150, learning_rate: 0.03, num_leaves: 15, max_depth: 3, min_child_samples: 20, subsample: 0.85, colsample_bytree: 0.85, reg_lambda: 5.0}
    - id: lightgbm_2
      params: {n_estimators: 220, learning_rate: 0.03, num_leaves: 31, max_depth: -1, min_child_samples: 30, subsample: 0.85, colsample_bytree: 0.85, reg_lambda: 10.0}
  random_forest:
    - id: random_forest_1
      params: {n_estimators: 120, max_depth: 4, min_samples_leaf: 3, max_features: sqrt}
    - id: random_forest_2
      params: {n_estimators: 220, max_depth: 6, min_samples_leaf: 5, max_features: sqrt}
  linear_lasso:
    - id: linear_lasso_1
      params: {alpha: 0.0001}
    - id: linear_lasso_2
      params: {alpha: 0.001}
    - id: linear_lasso_3
      params: {alpha: 0.01}
